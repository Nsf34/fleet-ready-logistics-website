<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #1A1A1A;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 72px;
    padding: 0 80px;
    width: 100%;
  }
  .logo-wrap {
    flex-shrink: 0;
  }
  .logo-wrap img {
    width: 260px;
    height: 260px;
    object-fit: contain;
  }
  .divider {
    width: 3px;
    height: 200px;
    background: #F5A623;
    flex-shrink: 0;
  }
  .text {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .tag {
    font-size: 18px;
    font-weight: 700;
    color: #F5A623;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  h1 {
    font-size: 52px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 1.1;
  }
  h1 em {
    font-style: normal;
    color: #F5A623;
  }
  .sub {
    font-size: 22px;
    color: rgba(255,255,255,0.7);
    font-weight: 400;
    line-height: 1.4;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="assets/logo-white.png" alt="Fleet Ready Logistics" />
    </div>
    <div class="divider"></div>
    <div class="text">
      <div class="tag">Now Hiring · Lodi, NJ</div>
      <h1>$23.75+/hr.<br>Local Routes.<br><em>Apply Today.</em></h1>
      <div class="sub">Amazon Delivery Service Partner</div>
    </div>
  </div>
</body>
</html>
